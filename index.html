<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dillon's desktop</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Lexend:wght@300;400;500;600&family=Patrick+Hand&family=Roboto+Mono:wght@500;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/desktop.css" />
  </head>
  <body>
    <!-- ===== Landing: 3D PC ===== -->
    <div id="landing">
      <!-- The "real world": a cozy bedroom in the evening, with a desk the PC sits on -->
      <div class="room" aria-hidden="true">
        <div class="wall-glow"></div>
        <!-- String lights: built by room.js to fit the screen width -->
        <svg class="string-lights"></svg>

        <!-- Framed art either side of the cork board (wide screens only) -->
        <svg class="wall-art left" viewBox="0 0 100 124">
          <rect x="2" y="2" width="96" height="120" rx="3" fill="#5a3b28" />
          <rect x="10" y="10" width="80" height="104" fill="#f1e2cc" />
          <defs>
            <linearGradient id="art-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6b38f" />
              <stop offset="1" stop-color="#f7d9a8" />
            </linearGradient>
          </defs>
          <rect x="18" y="18" width="64" height="88" fill="url(#art-sky)" />
          <circle cx="58" cy="56" r="11" fill="#fff1c9" />
          <path d="M18 106V78l14-12 12 10 14-16 24 22v24z" fill="#9b7bb5" />
          <path d="M18 106V88l18-10 16 9 12-6 18 11v14z" fill="#6f5a92" />
        </svg>
        <svg class="wall-art right" viewBox="0 0 100 100">
          <rect x="2" y="2" width="96" height="96" rx="3" fill="#5a3b28" />
          <rect x="10" y="10" width="80" height="80" fill="#2f2a33" />
          <circle cx="50" cy="50" r="30" fill="#141114" />
          <circle cx="50" cy="50" r="22" fill="none" stroke="#2c262c" stroke-width="1" />
          <circle cx="50" cy="50" r="16" fill="none" stroke="#2c262c" stroke-width="1" />
          <circle cx="50" cy="50" r="10" fill="#ef8fa6" />
          <circle cx="50" cy="50" r="1.6" fill="#141114" />
        </svg>

        <!-- Cork board on the wall, with a couple of little pinned notes -->
        <div class="corkboard">
          <div class="pinned-note pink">hackathon<br />this weekend!</div>
          <div class="pinned-note blue">to-do:<br />✓ build robot<br />✓ make website<br />☐ feed the cat</div>
        </div>
      </div>

      <div id="container3D"></div>

      <!-- Steam curling up from the coffee mug (placed by main.js) -->
      <svg class="steam" viewBox="0 0 30 40" aria-hidden="true">
        <path d="M11 38c-6-8 6-12 0-22s5-10 1-14" />
        <path d="M20 38c-6-8 6-12 0-22s5-10 1-14" />
      </svg>

      <!-- The cat from the to-do list, asleep on the rug under the desk.
           Positioned by main.js so it lines up with the 3D floor. -->
      <svg class="cat" viewBox="0 0 120 72" aria-hidden="true">
        <defs>
          <linearGradient id="cat-fur" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6b46e" />
            <stop offset="1" stop-color="#d9853f" />
          </linearGradient>
        </defs>
        <ellipse cx="60" cy="66" rx="48" ry="5" fill="rgba(20, 10, 5, 0.35)" />
        <g stroke="#3a261d" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
          <!-- body: a round loaf -->
          <path d="M22 64C18 42 36 24 60 24c22 0 38 14 38 32 0 6-4 8-10 8z" fill="url(#cat-fur)" />
          <!-- tail wrapped around the front -->
          <path d="M26 64c-8 0-12-4-10-9 2-4 8-4 10-1" fill="none" stroke="#3a261d" stroke-width="8" />
          <path d="M26 64c-8 0-12-4-10-9 2-4 8-4 10-1" fill="none" stroke="#e99a52" stroke-width="5.4" />
          <!-- head resting at the front -->
          <path d="M84 41l2-11 8 8z" fill="#f2a862" />
          <path d="M101 38l6-9 2 13z" fill="#f2a862" />
          <path d="M78 54c0-9 7-15 16-15s16 6 16 15c0 7-6 10-16 10s-16-3-16-10z" fill="url(#cat-fur)" />
          <!-- tucked front paw -->
          <ellipse cx="72" cy="62" rx="7" ry="3.2" fill="#f8c891" />
        </g>
        <!-- soft tabby stripes on the back -->
        <g fill="none" stroke="#c8742f" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
          <path d="M48 27q3 5 1 10M59 25q3 5 1 10M70 27q2 5 0 10" />
        </g>
        <!-- inner ears -->
        <path d="M86 38.5l1-5 3.6 3.6z" fill="#f4a3aa" />
        <path d="M102.5 36.5l2.6-4 .8 5.6z" fill="#f4a3aa" />
        <!-- sleepy face -->
        <g fill="none" stroke="#3a261d" stroke-width="1.3" stroke-linecap="round">
          <path d="M86 52.5q2.6 2 5.2 0M97 52.5q2.6 2 5.2 0" />
        </g>
        <path d="M93.4 56.2l1.2 1 1.2-1z" fill="#e9858f" />
        <circle cx="85.5" cy="57" r="2.2" fill="#f59aa0" opacity="0.55" />
        <circle cx="103" cy="57" r="2.2" fill="#f59aa0" opacity="0.55" />
        <text class="zzz" x="104" y="28">z</text>
        <text class="zzz" x="110" y="19">z</text>
      </svg>
      <div class="vignette"></div>

      <!-- Intro, as a post-it pinned to the cork board -->
      <header class="intro">
        <div class="intro-card">
          <h1>
            hi! <span class="accent">i<span class="apostrophe">'</span>m dillon</span>
            <!-- Hand-drawn waving hand, doodled in pen as one connected outline -->
            <svg class="wave" viewBox="-2 -3 68 58" aria-hidden="true">
              <g transform="rotate(28 24 42)" stroke="#3b3632" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                <path fill="#fff8e1" d="M17 46 L15.5 36 C13 33 10 30 7.5 26.5 C5.5 23.5 8 20.5 10.5 22.5 L15 26.5
                  L14 12 C13.8 8 19.6 7.8 19.8 11.8 L20.2 19 Q20.6 20.6 21 19
                  L21 7.5 C21 3.4 27 3.4 27 7.5 L27 19 Q27.4 20.6 27.8 19
                  L28 9.5 C28.2 5.6 33.8 5.8 33.6 9.8 L33.4 21 Q33.8 22.4 34.2 21
                  L34.6 12.8 C35 9.3 39.8 9.7 39.6 13.3 L39.4 30 C39.2 37 36 41 34 46 Z" />
              </g>
              <g fill="none" stroke="#2456c9" stroke-width="2" stroke-linecap="round">
                <path d="M58.5 13c3 2 4.5 5 4.2 8.5" />
                <path d="M55.5 18.5c2 1.2 2.6 3 2.5 5" />
                <path d="M14.5 8c-2.5 2-3.6 4.5-3.4 7.5" />
              </g>
            </svg>
          </h1>
          <p class="subtitle">computer engineering student @ the university of kansas</p>
          <button id="learn-more" class="pill-button" type="button">click here to learn more about me</button>

          <!-- Little pink note stuck on the corner, pointing down at the PC -->
          <div class="spin-note" aria-hidden="true">
            spin me!
            <svg class="spin-arrow" viewBox="0 0 50 50">
              <path d="M33 4c5 15-1 27-17 36" />
              <path d="M16 40l11.5-1.5M16 40l0.5-11.5" />
            </svg>
          </div>
        </div>
      </header>
    </div>

    <!-- ===== Desktop: XP-style shell ===== -->
    <div id="desktop" hidden>
      <nav id="desktop-icons" aria-label="Desktop"></nav>
      <div id="window-layer"></div>

      <div id="start-menu" hidden>
        <div class="start-header">
          <span class="start-avatar" aria-hidden="true">D</span>
          <span class="start-user-name"></span>
        </div>
        <div class="start-columns">
          <ul class="start-apps"></ul>
          <ul class="start-links"></ul>
        </div>
        <div class="start-footer">
          <div class="start-footer-info">
            <button type="button" class="credits-button" data-app="credits">Credits</button>
            <span class="start-copyright"></span>
          </div>
          <button type="button" class="log-off">
            <span class="log-off-icon" aria-hidden="true">⏻</span> Log Off
          </button>
        </div>
      </div>

      <footer id="taskbar">
        <button id="start-button" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="start-flag" aria-hidden="true"></span>start
        </button>
        <div id="task-list"></div>
        <div id="tray">
          <time id="tray-clock"></time>
        </div>
      </footer>
    </div>

    <div id="fade-overlay" class="fade-overlay" aria-hidden="true"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
